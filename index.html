<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root{
    --sky1:#1d4f8f; --sky2:#0d1a33;
    --card:rgba(255,255,255,.08); --card-b:rgba(255,255,255,.14);
    --txt:#f4f7ff; --mut:#b4c2df; --acc:#7cc8ff; --good:#7ee2b8; --warn:#ffd36b; --bad:#ff8f8f;
    --r:22px;
  }
  *{box-sizing:border-box}
  html{background:var(--sky2)}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--txt);min-height:100vh;min-height:100dvh;
    background:var(--sky2) linear-gradient(180deg,var(--sky1) 0,var(--sky2) 520px) no-repeat;
    transition:background .6s;
    padding:calc(env(safe-area-inset-top) + 10px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 20px) max(16px,env(safe-area-inset-left));
    -webkit-font-smoothing:antialiased;
  }
  body[data-sky="sereno"]{--sky1:#2f7fd6;--sky2:#0f2448}
  body[data-sky="nuvole"]{--sky1:#4d6283;--sky2:#151d2e}
  body[data-sky="pioggia"]{--sky1:#35465f;--sky2:#0f141f}
  body[data-sky="temporale"]{--sky1:#3a3555;--sky2:#0d0b18}
  body[data-sky="neve"]{--sky1:#6f85a6;--sky2:#1a2333}
  body[data-sky="notte"]{--sky1:#16244a;--sky2:#070b18}
  .wrap{max-width:1200px;margin:0 auto}
  button{font:inherit;color:inherit;cursor:pointer}

  /* Barra in alto */
  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .logo{width:34px;height:34px;flex:0 0 34px}
  .place-btn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--card-b);border-radius:16px;padding:7px 12px;text-align:left}
  .place-btn:hover{border-color:var(--acc)}
  .place-btn svg{width:18px;height:18px;flex:0 0 18px}
  .place-btn .pl{flex:1;min-width:0;display:flex;flex-direction:column}
  .place-btn b{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
  .place-btn small{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .place-btn small:empty{display:none}
  .logo{display:none}
  @media (min-width:760px){.logo{display:block}}
  .icon-btn{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--card-b);display:grid;place-items:center;flex:0 0 42px}
  .icon-btn svg{width:20px;height:20px}
  .icon-btn.spin svg{animation:rot 1s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* Griglia */
  .grid{display:grid;gap:14px;grid-template-columns:1fr}
  .card{background:var(--card);border:1px solid var(--card-b);border-radius:var(--r);padding:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0}
  .card h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 12px;font-weight:600}
  .a-hero{grid-area:hero}.a-hours{grid-area:hours}.a-days{grid-area:days}.a-avv{grid-area:avv}.a-map{grid-area:map}
  .grid{grid-template-areas:"hero" "hours" "days" "avv" "map"}
  @media (min-width:760px){
    .grid{grid-template-columns:1fr 1fr;grid-template-areas:"hero days" "hours hours" "avv map"}
  }
  @media (min-width:1180px){
    .grid{grid-template-columns:1.2fr 1fr 1fr;grid-template-areas:"hero days avv" "hours hours hours" "map map map"}
  }
  .nowcast .msg svg{width:18px;height:18px;flex:0 0 18px}

  /* Adesso */
  .hero{display:flex;flex-direction:column;gap:14px}
  .now{display:flex;align-items:center;gap:14px}
  .now .big-ico{width:112px;height:112px;flex:0 0 112px}
  .temp{font-size:84px;font-weight:200;line-height:.9;letter-spacing:-3px}
  .cond{font-size:20px;font-weight:600;margin-top:6px}
  .feel{color:var(--mut);font-size:14px;margin-top:2px}
  .minmax{color:var(--mut);font-size:14px;margin-top:2px}
  .nowcast{background:rgba(0,0,0,.18);border-radius:16px;padding:12px 14px}
  .nowcast .msg{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
  .bars{display:flex;align-items:flex-end;gap:4px;height:34px;margin-top:10px}
  .bars i{flex:1;background:var(--acc);border-radius:4px 4px 2px 2px;min-height:3px;opacity:.9}
  .bars i.dry{background:rgba(255,255,255,.16)}
  .bars-lbl{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-top:4px}
  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .fact{background:rgba(0,0,0,.14);border-radius:14px;padding:10px 12px;min-width:0}
  .fact small{display:block;color:var(--mut);font-size:12px}
  .fact b{font-size:17px;font-weight:600;display:block;margin-top:2px;white-space:nowrap}
  .fact em{font-style:normal;color:var(--mut);font-size:12px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.2);color:var(--mut)}
  .chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* Ore */
  .hscroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;margin:0 -6px;padding:0 6px 6px}
  .hrow{position:relative;display:flex}
  .hcol{flex:0 0 54px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;z-index:1}
  .hcol .t{font-size:12px;color:var(--mut)}
  .hcol.now-col .t{color:var(--txt);font-weight:700}
  .hcol svg.ico{width:30px;height:30px}
  .hcol .deg{font-size:15px;font-weight:600;height:62px;display:flex;align-items:flex-start;justify-content:center}
  .hcol .rain{height:38px;width:22px;display:flex;align-items:flex-end;justify-content:center}
  .hcol .rain i{display:block;width:16px;background:var(--acc);border-radius:4px 4px 1px 1px;opacity:.85}
  .hcol .mm{font-size:11px;color:var(--acc);height:14px;white-space:nowrap}
  .hcol .prob{font-size:12px;color:var(--acc);height:15px;font-weight:600;white-space:nowrap}
  .hcol .wind{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:2px}
  .hcol .day-sep{position:absolute;left:-1px;top:0;bottom:0;border-left:1px dashed rgba(255,255,255,.18)}
  .hcol .day-lbl{position:absolute;top:-2px;left:4px;font-size:10px;color:var(--warn);white-space:nowrap}
  .tline{position:absolute;left:0;top:0;pointer-events:none;z-index:0}
  .arrow{display:inline-block;width:12px;height:12px}

  /* Giorni */
  .day{display:grid;grid-template-columns:62px 34px 1fr 64px;align-items:center;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08)}
  .day:first-of-type{border-top:0}
  .day .dn{font-weight:600}
  .day .dn small{display:block;color:var(--mut);font-weight:400;font-size:12px}
  .day svg{width:32px;height:32px}
  .range{display:flex;align-items:center;gap:8px;font-size:14px}
  .range .lo{color:var(--mut);width:28px;text-align:right}
  .range .hi{width:28px}
  .range .track{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.12);position:relative}
  .range .fill{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#7cc8ff,#ffd36b,#ff9a6b)}
  .day .pr{font-size:12px;color:var(--acc);text-align:right}

  /* Dettagli */
  .details{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .moon{display:flex;align-items:center;gap:12px;margin-top:10px}
  .moon .e{font-size:34px}
  .moon small{color:var(--mut);display:block;font-size:12px}

  /* Avvisi */
  .alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;margin-bottom:8px;background:rgba(255,211,107,.12);border:1px solid rgba(255,211,107,.35)}
  .alert.red{background:rgba(255,143,143,.12);border-color:rgba(255,143,143,.4)}
  .alert.ok{background:rgba(126,226,184,.1);border-color:rgba(126,226,184,.3)}
  .alert small{display:block;color:var(--mut)}
  .note{font-size:12px;color:var(--mut);margin-top:8px}
  .note a{color:var(--acc)}
  .notify{margin-top:12px;width:100%;padding:11px;border-radius:14px;background:rgba(124,200,255,.16);border:1px solid rgba(124,200,255,.4);font-weight:600}

  /* Mappa */
  #map{height:320px;border-radius:16px;overflow:hidden;background:#0a1222}
  .radar-ctl{display:flex;align-items:center;gap:10px;margin-top:10px}
  .radar-ctl button{background:var(--card);border:1px solid var(--card-b);border-radius:12px;padding:7px 12px}
  .radar-ctl input{flex:1}
  .radar-ctl span{font-size:13px;color:var(--mut);min-width:44px;text-align:right}

  /* Scheda località */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:1000}
  .sheet{position:fixed;left:50%;top:max(20px,env(safe-area-inset-top));transform:translateX(-50%);width:min(520px,calc(100% - 24px));max-height:calc(100dvh - 40px);overflow:auto;background:#14213d;border:1px solid var(--card-b);border-radius:22px;padding:16px;display:none;z-index:1001}
  .sheet.open,.sheet-bg.open{display:block}
  .sheet input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--card-b);background:rgba(0,0,0,.25);color:var(--txt);font-size:16px;outline:none}
  .sheet input:focus{border-color:var(--acc)}
  .sheet .row{display:flex;align-items:center;gap:10px;padding:11px 8px;border-radius:12px}
  .sheet .row:hover{background:rgba(255,255,255,.06)}
  .sheet .row .nm{flex:1;cursor:pointer}
  .sheet .row button{background:none;border:0;color:var(--mut);font-size:18px;padding:2px 6px}
  .sheet h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 8px 4px;font-weight:600}
  .sheet .gps{width:100%;margin-top:10px;padding:12px;border-radius:14px;border:0;background:linear-gradient(135deg,#7cc8ff,#3a8de0);color:#06121f;font-weight:700}

  .loader{display:grid;place-items:center;min-height:50vh;color:var(--mut);gap:12px}
  .err{background:rgba(255,143,143,.12);border:1px solid rgba(255,143,143,.4);padding:14px;border-radius:16px}
  footer{text-align:center;color:var(--mut);font-size:11px;margin-top:22px;line-height:1.7}
  footer a{color:var(--mut)}
  .hidden{display:none!important}
</style>
</head>

<script>
"use strict";
// Impedisce ad altri siti di mostrare l'app dentro una loro pagina
if(window.top!==window.self){ document.body.innerHTML='<p style="padding:20px"><a href="./" target="_top" rel="noopener" style="color:#7cc8ff">Apri Meteo Perfetto</a></p>'; throw new Error("incorniciata"); }
const $=s=>document.querySelector(s);

// ===== Modelli: peso a breve (oggi/domani) e a lungo termine =====
// I modelli locali ad alta risoluzione contano di più nelle prime 48 ore,
// quelli globali più affidabili contano di più per i giorni successivi.
const MODELS=[
  {id:"italia_meteo_arpae_icon_2i", s:3,   l:0},
  {id:"icon_d2",                    s:3,   l:0},
  {id:"meteofrance_seamless",       s:2.5, l:1.5},
  {id:"icon_seamless",              s:2,   l:2},
  {id:"ecmwf_ifs025",               s:2,   l:3},
  {id:"ukmo_seamless",              s:1.5, l:2},
  {id:"gfs_seamless",               s:1,   l:1.5},
  {id:"gem_seamless",               s:1,   l:1},
  {id:"jma_seamless",               s:1,   l:.5},
  {id:"kma_seamless",               s:1,   l:.5}
];
// Fuori dalla loro zona i modelli locali non hanno dati e vengono esclusi da soli,
// quindi il calcolo vale in tutto il mondo.
const HOURLY=["temperature_2m","apparent_temperature","relative_humidity_2m","precipitation","weather_code","cloud_cover","wind_speed_10m","wind_direction_10m","wind_gusts_10m","is_day"];
const MIN15=["precipitation"];
function weight(m,leadH){ const t=Math.min(1,Math.max(0,(leadH-24)/48)); return m.s*(1-t)+m.l*t; }

const DEFAULT_FAVS=[
  {name:"Viserba (Rimini)",lat:44.0807,lon:12.5276},
  {name:"Rimini",lat:44.0594,lon:12.5683},
  {name:"Roma",lat:41.9028,lon:12.4964},
  {name:"Milano",lat:45.4642,lon:9.19},
  {name:"Bologna",lat:44.4949,lon:11.3426}
];
const S={lat:null,lon:null,name:"",geo:null,favs:[],recent:[],data:null,marine:null,radar:null,cons:null,notify:false,lastRainAlert:0};

// ===== Utilità =====
const pad=n=>String(n).padStart(2,"0");
const hm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const near=(a,b)=>Math.abs(a.lat-b.lat)<.01&&Math.abs(a.lon-b.lon)<.01;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
const DIRS=["N","NE","E","SE","S","SO","O","NO"];
const dirTxt=d=>d==null?"":DIRS[Math.round(((d%360)+360)%360/45)%8];
function arrow(deg){ // la freccia indica dove va il vento
  return `<svg class="arrow" viewBox="0 0 24 24" style="transform:rotate(${(deg+180)%360}deg)"><path d="M12 3l6 14-6-4-6 4z" fill="currentColor"/></svg>`;
}
function seaState(h){
  if(h==null||isNaN(h)) return null;
  if(h<.1) return "Calmo"; if(h<.5) return "Poco mosso"; if(h<1.25) return "Mosso";
  if(h<2.5) return "Molto mosso"; if(h<4) return "Agitato"; if(h<6) return "Molto agitato";
  if(h<9) return "Grosso"; if(h<14) return "Molto grosso"; return "Tempestoso";
}
function moonPhase(date){
  const syn=29.530588853, ref=Date.UTC(2000,0,6,18,14)/864e5;
  const age=((date.getTime()/864e5-ref)%syn+syn)%syn;
  const illum=Math.round((1-Math.cos(2*Math.PI*age/syn))/2*100);
  const ph=[["Luna nuova","🌑"],["Luna crescente","🌒"],["Primo quarto","🌓"],["Gibbosa crescente","🌔"],["Luna piena","🌕"],["Gibbosa calante","🌖"],["Ultimo quarto","🌗"],["Luna calante","🌘"]];
  const i=Math.round(age/syn*8)%8; return {name:ph[i][0],emoji:ph[i][1],illum};
}

// ===== Descrizioni e icone =====
const WMO={0:"Sereno",1:"Poco nuvoloso",2:"Parzialmente nuvoloso",3:"Nuvoloso",45:"Nebbia",48:"Nebbia",
  51:"Pioviggine",53:"Pioviggine",55:"Pioviggine",56:"Pioviggine gelata",57:"Pioviggine gelata",
  61:"Pioggia debole",63:"Pioggia",65:"Pioggia forte",66:"Pioggia gelata",67:"Pioggia gelata",
  71:"Neve debole",73:"Neve",75:"Neve forte",77:"Nevischio",80:"Rovesci",81:"Rovesci",82:"Rovesci forti",
  85:"Rovesci di neve",86:"Rovesci di neve",95:"Temporale",96:"Temporale con grandine",99:"Temporale con grandine"};
const isWet=c=>c>=51; const isSnow=c=>(c>=71&&c<=77)||c===85||c===86; const isStorm=c=>c>=95;
function icon(code,day=true,cls="ico"){
  const sun=`<circle cx="32" cy="30" r="11" fill="#ffd36b"/><g stroke="#ffd36b" stroke-width="3" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<line x1="${32+17*Math.cos(r)}" y1="${30+17*Math.sin(r)}" x2="${32+23*Math.cos(r)}" y2="${30+23*Math.sin(r)}"/>`;}).join("")}</g>`;
  const moon=`<path d="M38 12a17 17 0 1 0 14 24A14 14 0 0 1 38 12z" fill="#e6ecff"/>`;
  const small=day?`<g transform="translate(-6 -6) scale(.8)">${sun}</g>`:`<g transform="translate(-4 -6) scale(.75)">${moon}</g>`;
  const cloud=(f="#eef3ff",y=0)=>`<path transform="translate(0 ${y})" d="M20 50h28a10 10 0 0 0 0-20 14 14 0 0 0-27-3 9 9 0 0 0-1 23z" fill="${f}"/>`;
  const drops=n=>[...Array(n)].map((_,k)=>`<line x1="${24+k*8}" y1="54" x2="${21+k*8}" y2="61" stroke="#7cc8ff" stroke-width="3" stroke-linecap="round"/>`).join("");
  const flakes=n=>[...Array(n)].map((_,k)=>`<circle cx="${24+k*8}" cy="${57+(k%2)*3}" r="2.6" fill="#fff"/>`).join("");
  let g;
  if(code===0) g=day?sun:moon;
  else if(code===1) g=small+cloud("#eef3ff",4).replace('M20','M26').replace('h28','h22');
  else if(code===2) g=small+cloud();
  else if(code===3) g=cloud("#9fb0cc",-6)+cloud("#dfe6f5",2);
  else if(code===45||code===48) g=cloud("#c9d3e6",-6)+`<g stroke="#c9d3e6" stroke-width="3" stroke-linecap="round"><line x1="14" y1="52" x2="50" y2="52"/><line x1="18" y1="59" x2="46" y2="59"/></g>`;
  else if(isStorm(code)) g=cloud("#7d8aa6",-4)+`<path d="M34 44l-7 11h6l-4 9 11-13h-6l4-7z" fill="#ffd36b"/>`;
  else if(isSnow(code)) g=cloud("#dfe6f5",-4)+flakes(code===71||code===85?2:3);
  else if(code>=80) g=small+cloud("#dfe6f5",-2)+drops(code===82?4:3);
  else if(code>=51&&code<=57) g=cloud("#c9d3e6",-4)+drops(2);
  else g=cloud("#b8c4da",-4)+drops(code===65?4:3);
  return `<svg class="${cls}" viewBox="0 0 64 64" aria-hidden="true">${g}</svg>`;
}

// ===== Dati =====
async function fetchJSON(u,tries=2){
  for(let k=0;k<=tries;k++){
    try{ const r=await fetch(u); if(r.ok) return await r.json(); if(r.status!==429&&r.status<500) break; }catch(e){}
    await new Promise(res=>setTimeout(res,700*(k+1)));
  }
  return null;
}
async function loadForecast(lat,lon){
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
    +`&hourly=${HOURLY.join(",")}&minutely_15=${MIN15.join(",")}&daily=sunrise,sunset`
    +`&models=${MODELS.map(m=>m.id).join(",")}&wind_speed_unit=kn&timezone=auto&forecast_days=8`;
  const j=await fetchJSON(u); if(!j||!j.hourly) throw new Error("dati non raggiungibili");
  return j;
}
async function loadMarine(lat,lon){
  const j=await fetchJSON(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=wave_height,wave_direction,sea_level_height_msl&timezone=auto&forecast_days=3`,1);
  if(!j||!j.hourly||!j.hourly.wave_height||!j.hourly.wave_height.some(v=>v!=null)) return null;
  return j;
}

// ===== Consenso pesato tra i modelli =====
function series(block,v){ const out=[]; MODELS.forEach(m=>{const a=block[`${v}_${m.id}`]; if(a) out.push({m,a});}); return out; }
function wmean(list,i,lead,circ=false){
  let sw=0,s=0,x=0,y=0; const vals=[];
  list.forEach(({m,a})=>{const v=a[i]; if(v==null||isNaN(v)) return; const w=weight(m,lead); if(!w) return;
    sw+=w; vals.push([v,w]); if(circ){const r=v*Math.PI/180;x+=w*Math.cos(r);y+=w*Math.sin(r);} else s+=w*v;});
  if(!sw) return {v:null,sd:0};
  if(circ) return {v:(Math.atan2(y,x)*180/Math.PI+360)%360,sd:0};
  const mu=s/sw; const sd=Math.sqrt(vals.reduce((t,[v,w])=>t+w*(v-mu)**2,0)/sw);
  return {v:mu,sd};
}
// Quota (0-1) del peso dei modelli che prevedono una condizione
function share(list,i,lead,test){ let sw=0,sy=0; list.forEach(({m,a})=>{const v=a[i]; if(v==null) return; const w=weight(m,lead); if(!w) return; sw+=w; if(test(v,m)) sy+=w;}); return sw?sy/sw:null; }

function consensus(D){
  const H=D.hourly, n=H.time.length, now=Date.now();
  const L={}; HOURLY.forEach(v=>L[v]=series(H,v));
  const hours=[];
  for(let i=0;i<n;i++){
    const t=new Date(H.time[i]); const lead=Math.max(0,(t-now)/36e5);
    const T=wmean(L.temperature_2m,i,lead); if(T.v==null) { hours.push(null); continue; }
    const P=wmean(L.precipitation,i,lead);
    const wetShare=share(L.weather_code,i,lead,c=>isWet(c));
    const prShare=share(L.precipitation,i,lead,v=>v>=.1);
    const rainy=Math.max(wetShare??0,prShare??0)>=.5;
    const cloud=wmean(L.cloud_cover,i,lead).v;
    let code;
    if(rainy){
      const storm=share(L.weather_code,i,lead,isStorm)>=.35;
      const snowy=share(L.weather_code,i,lead,c=>isWet(c)&&isSnow(c))>=.5 || T.v<=.5;
      const mm=P.v||0;
      if(storm) code=95; else if(snowy) code=mm>=2?75:mm>=.5?73:71;
      else { const conv=share(L.weather_code,i,lead,c=>c>=80&&c<=82)>=.5; code=conv?(mm>=4?82:80):(mm>=4?65:mm>=1?63:61); }
    } else if(share(L.weather_code,i,lead,c=>c===45||c===48)>=.5) code=45;
    else code=cloud==null?0:cloud<20?0:cloud<45?1:cloud<75?2:3;
    hours.push({
      t, i, code, temp:T.v, sd:T.sd,
      feel:wmean(L.apparent_temperature,i,lead).v,
      hum:wmean(L.relative_humidity_2m,i,lead).v,
      pr:rainy?Math.max(P.v||0,.1):0, prShare:Math.max(wetShare??0,prShare??0),
      wind:wmean(L.wind_speed_10m,i,lead).v, gust:wmean(L.wind_gusts_10m,i,lead).v,
      dir:wmean(L.wind_direction_10m,i,lead,true).v,
      day:(()=>{const s=series(H,"is_day").find(x=>x.a[i]!=null);return s?!!s.a[i]:true;})()
    });
  }
  // Prossime 2 ore a passi di 15 minuti: solo modelli a breve termine
  const M=D.minutely_15, steps=[];
  if(M&&M.time){
    const Lm=series(M,"precipitation");
    let k0=M.time.findIndex(t=>new Date(t).getTime()>now-15*6e4); if(k0<0) k0=0;
    for(let k=k0;k<Math.min(M.time.length,k0+8);k++){
      const sh=share(Lm,k,0,v=>v>=.05), mm=wmean(Lm,k,0).v;
      steps.push({t:new Date(M.time[k]),share:sh??0,mm:mm||0});
    }
  }
  // Alba e tramonto
  const sun={}; if(D.daily){ const d=D.daily; const pick=v=>{for(const m of MODELS){const a=d[`${v}_${m.id}`]; if(a&&a.some(x=>x)) return a;} return d[v]||[];};
    const sr=pick("sunrise"), ss=pick("sunset"); (d.time||[]).forEach((t,k)=>sun[t]={rise:sr[k],set:ss[k]}); }
  return {hours,steps,sun};
}

// ===== Radar: cosa succede davvero adesso =====
const Z=7, RPX=34; // zoom 7, raggio di ~30 km
function px(lat,lon){ const n=256*2**Z, r=lat*Math.PI/180; return {x:(lon+180)/360*n, y:(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n}; }
function tileImg(url){ return new Promise(res=>{ const im=new Image(); im.crossOrigin="anonymous"; im.onload=()=>res(im); im.onerror=()=>res(null); im.src=url; }); }
async function alphaGrid(urlFor,lat,lon){
  const c=px(lat,lon), x0=Math.floor(c.x-RPX), y0=Math.floor(c.y-RPX), N=2*RPX+1;
  const cv=document.createElement("canvas"); cv.width=N; cv.height=N; const g=cv.getContext("2d",{willReadFrequently:true});
  const tiles=[]; for(let tx=Math.floor(x0/256);tx<=Math.floor((x0+N)/256);tx++) for(let ty=Math.floor(y0/256);ty<=Math.floor((y0+N)/256);ty++) tiles.push([tx,ty]);
  const ims=await Promise.all(tiles.map(([tx,ty])=>tileImg(urlFor(tx,ty))));
  if(ims.some(im=>!im)) return null;
  ims.forEach((im,k)=>g.drawImage(im,tiles[k][0]*256-x0,tiles[k][1]*256-y0));
  const d=g.getImageData(0,0,N,N).data, cx=c.x-x0, cy=c.y-y0;
  return {get:(x,y)=>d[(y*N+x)*4+3], N, cx, cy};
}
async function radarNow(lat,lon){
  const meta=await fetchJSON("https://api.rainviewer.com/public/weather-maps.json",1);
  if(!meta||!meta.radar||!meta.radar.past||!meta.radar.past.length) return null;
  const host=meta.host, past=meta.radar.past, last=past[past.length-1], prev=past[Math.max(0,past.length-4)];
  const cov=await alphaGrid((x,y)=>`${host}/v2/coverage/0/256/${Z}/${x}/${y}/0/0_0.png`,lat,lon);
  // Nell'immagine di copertura le zone senza radar sono nere: qui serve un punto trasparente
  if(!cov||cov.get(Math.round(cov.cx),Math.round(cov.cy))) return {frames:past,host,covered:false};
  const scan=async fr=>{
    const g=await alphaGrid((x,y)=>`${host}${fr.path}/256/${Z}/${x}/${y}/2/0_0.png`,lat,lon); if(!g) return null;
    let here=0,best=Infinity;
    for(let y=0;y<g.N;y++) for(let x=0;x<g.N;x++){ if(!g.get(x,y)) continue; const dd=Math.hypot(x-g.cx,y-g.cy); if(dd<=2.5) here++; if(dd<best) best=dd; }
    return {here:here>=2,dist:best};
  };
  const [a,b]=await Promise.all([scan(last),scan(prev)]);
  if(!a) return {frames:past,host,covered:false};
  const kmpx=40075*Math.cos(lat*Math.PI/180)/(256*2**Z);
  const dist=isFinite(a.dist)?a.dist*kmpx:null, distPrev=b&&isFinite(b.dist)?b.dist*kmpx:null;
  const mins=(last.time-prev.time)/60;
  let eta=null; if(!a.here&&dist!=null&&distPrev!=null&&distPrev-dist>1.5&&mins>0){ eta=Math.round(dist/((distPrev-dist)/mins)); }
  return {frames:past,host,covered:true,raining:a.here,dist,eta,time:new Date(last.time*1000)};
}

// "Adesso": i modelli danno la base, il radar decide se piove davvero
function buildNow(C,R){
  const now=Date.now(); const hs=C.hours.filter(Boolean);
  let i=hs.findIndex(h=>h.t.getTime()>now); if(i<=0) i=1; const a=hs[i-1], b=hs[i]||a;
  const f=Math.min(1,Math.max(0,(now-a.t)/(b.t-a.t||1)));
  const lerp=(x,y)=>x==null?y:y==null?x:x+(y-x)*f;
  const cur={...a, temp:lerp(a.temp,b.temp), feel:lerp(a.feel,b.feel), hum:lerp(a.hum,b.hum), wind:lerp(a.wind,b.wind), gust:lerp(a.gust,b.gust)};
  const step0=C.steps[0];
  if(R&&R.covered){
    if(R.raining){
      if(!isWet(cur.code)) cur.code=cur.temp<=.5?71:61;
      cur.pr=Math.max(cur.pr,step0?step0.mm*4:.2);
    } else if(isWet(cur.code)){
      cur.code=Math.max(2,cur.code===95?3:3); cur.pr=0;
    }
    cur.observed=true;
  }
  return cur;
}
function nowcastText(C,R,cur){
  const st=C.steps; const wetNow=isWet(cur.code);
  const firstWet=st.findIndex(s=>s.share>=.5);
  if(wetNow){
    const dry=st.findIndex((s,k)=>k>0&&s.share<.35);
    return dry>0?`Smette verso le ${hm(st[dry].t)}`:"Pioggia anche nelle prossime 2 ore";
  }
  if(R&&R.covered&&R.eta!=null&&R.eta<=120) return `Pioggia in avvicinamento: arriva tra circa ${Math.max(5,Math.round(R.eta/5)*5)} minuti`;
  if(firstWet>0) return `Pioggia possibile verso le ${hm(st[firstWet].t)}`;
  if(R&&R.covered&&R.dist!=null&&R.dist<15) return `Piove a circa ${Math.round(R.dist)} km da qui`;
  return "Niente pioggia nelle prossime 2 ore";
}

// ===== Avvisi calcolati sulle prossime 24 ore =====
function alerts(C){
  const now=Date.now(), next=C.hours.filter(h=>h&&h.t.getTime()>=now-36e5&&h.t.getTime()<=now+24*36e5); const out=[];
  const at=h=>`${h.t.toLocaleDateString("it-IT",{weekday:"short"})} ${pad(h.t.getHours())}:00`;
  const maxBy=(k)=>next.reduce((m,h)=>h[k]!=null&&(!m||h[k]>m[k])?h:m,null);
  const g=maxBy("gust"); if(g&&g.gust>=34) out.push(["red","Vento forte",`Raffiche fino a ${Math.round(g.gust)} nodi, ${at(g)}`]); else if(g&&g.gust>=25) out.push(["","Vento sostenuto",`Raffiche fino a ${Math.round(g.gust)} nodi, ${at(g)}`]);
  const st=next.find(h=>isStorm(h.code)); if(st) out.push(["red","Temporali",`Possibili da ${at(st)}`]);
  const p=maxBy("pr"); if(p&&p.pr>=10) out.push(["red","Pioggia intensa",`Fino a ${p.pr.toFixed(0)} mm in un'ora, ${at(p)}`]);
  const tot=next.reduce((s,h)=>s+(h.pr||0),0); if(tot>=30) out.push(["","Piogge abbondanti",`Circa ${tot.toFixed(0)} mm nelle prossime 24 ore`]);
  const sn=next.find(h=>isSnow(h.code)); if(sn) out.push(["","Neve",`Possibile da ${at(sn)}`]);
  const hot=maxBy("temp"); if(hot&&hot.temp>=35) out.push(["red","Caldo intenso",`Fino a ${Math.round(hot.temp)}°`]);
  const cold=next.reduce((m,h)=>!m||h.temp<m.temp?h:m,null); if(cold&&cold.temp<=-3) out.push(["","Gelo",`Fino a ${Math.round(cold.temp)}°, ${at(cold)}`]);
  return out;
}
function alertLink(){

function skyFor(code,day){
  if(isStorm(code)) return "temporale"; if(isSnow(code)) return "neve"; if(isWet(code)) return "pioggia";
  if(!day) return "notte"; return code>=3||code===45?"nuvole":"sereno";
}
function reliability(cur){
  const s=cur.sd+(cur.prShare>.2&&cur.prShare<.8?1.5:0);
  return s<1.2?["Affidabilità alta","var(--good)"]:s<2.5?["Affidabilità media","var(--warn)"]:["Affidabilità bassa","var(--bad)"];
}

function localDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

function drawTempLine(){

  const temps=cols.map(c=>+c.querySelector(".deg").dataset.temp), mx=Math.max(...temps), mn=Math.min(...temps), span=Math.max(1,mx-mn);
  const W=row.scrollWidth, base=cols[0].querySelector(".deg").offsetTop;
  svg.setAttribute("width",W); svg.setAttribute("height",row.offsetHeight); svg.setAttribute("viewBox",`0 0 ${W} ${row.offsetHeight}`);
  const pts=cols.map((c,k)=>{ const y=base+22+(1-(temps[k]-mn)/span)*36; c.querySelector(".deg").style.paddingTop=(y-base-20)+"px"; return [c.offsetLeft+c.offsetWidth/2,y+14]; });
  const d=pts.map((p,k)=>(k?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  svg.innerHTML=`<path d="${d}" fill="none" stroke="rgba(255,211,107,.55)" stroke-width="2" stroke-linejoin="round"/>`;
}
function daily(C){
  const byDay={}; C.hours.forEach(h=>{ if(!h) return; const k=localDate(h.t); (byDay[k]=byDay[k]||[]).push(h); });
  const keys=Object.keys(byDay).filter(k=>k>=localDate(new Date())).slice(0,7);
  const days=keys.map(k=>{ const hs=byDay[k]; const daytime=hs.filter(h=>h.t.getHours()>=7&&h.t.getHours()<=20); const pool=daytime.length?daytime:hs;
    const wet=pool.filter(h=>isWet(h.code)); let code;
    if(wet.length>=2){ code=wet.some(h=>isStorm(h.code))?95:wet.reduce((m,h)=>h.code>m?h.code:m,0); if(code>=80&&code<95) code=wet.length>=6?63:80; }
    else { const cc=pool.reduce((s,h)=>s+h.code,0)/pool.length; code=pool.some(h=>h.code===45)&&cc>2.5?45:Math.round(Math.min(3,cc)); }
    return {k,code,prob:Math.max(...hs.map(h=>h.prShare||0)),hi:Math.max(...hs.map(h=>h.temp)),lo:Math.min(...hs.map(h=>h.temp)),pr:hs.reduce((s,h)=>s+(h.pr||0),0),gust:Math.max(...hs.map(h=>h.gust||0))};
  });
  const gmx=Math.max(...days.map(d=>d.hi)), gmn=Math.min(...days.map(d=>d.lo)), sp=Math.max(1,gmx-gmn);
  return days.map((d,k)=>{ const dt=new Date(d.k+"T12:00");
    const name=k===0?"Oggi":k===1?"Domani":dt.toLocaleDateString("it-IT",{weekday:"short"});
    return `<div class="day"><div class="dn">${name}<small>${dt.getDate()}/${dt.getMonth()+1}</small></div>${icon(d.code,true)}
      <div class="range"><span class="lo">${Math.round(d.lo)}°</span><span class="track"><span class="fill" style="left:${(d.lo-gmn)/sp*100}%;right:${(gmx-d.hi)/sp*100}%"></span></span><span class="hi">${Math.round(d.hi)}°</span></div>
      <div class="pr">${d.prob>=.1?`<b>${probTxt(d.prob)}</b><br>`:""}${d.pr>=.5?Math.round(d.pr)+" mm":""}${d.gust>=25?`<br><span style="color:var(--warn)">${Math.round(d.gust)} kn</span>`:""}</div></div>`; }).join("");
}
function marineNow(){
  const M=S.marine; if(!M) return null;
  const now=new Date(); let i=0; for(let k=0;k<M.hourly.time.length;k++){ if(new Date(M.hourly.time[k])<=now) i=k; else break; }
  const wh=M.hourly.wave_height[i]; const st=seaState(wh); if(st==null) return null;
  const sl=M.hourly.sea_level_height_msl; let tide=null, cur=null;
  if(sl&&sl[i]!=null&&sl[i+1]!=null){ cur=sl[i]; tide=sl[i+1]>sl[i]?"Crescente":"Calante"; }
  return {st,wh,tide,sl:cur};
}

// ===== Mappa radar =====
let map=null, radarLayers=[], rIdx=0, rTimer=null;
function setupMap(){
  if(typeof L==="undefined"){ $("#map").innerHTML='<div class="loader">Mappa non disponibile offline</div>'; return; }
  if(map){ map.remove(); map=null; }
  map=L.map("map",{zoomControl:true,attributionControl:false}).setView([S.lat,S.lon],8);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:12}).addTo(map);
  L.circleMarker([S.lat,S.lon],{radius:7,color:"#fff",weight:2,fillColor:"#3a8de0",fillOpacity:1}).addTo(map);
  radarLayers=[]; const R=S.radar; if(!R||!R.frames) return;
  R.frames.forEach(fr=>radarLayers.push(L.tileLayer(`${R.host}${fr.path}/256/{z}/{x}/{y}/2/1_1.png`,{opacity:0,maxNativeZoom:7,maxZoom:12,zIndex:5}).addTo(map)));
  const sl=$("#rSlider"); sl.max=radarLayers.length-1; sl.oninput=()=>radarSet(+sl.value);
  $("#rPlay").onclick=()=>{ if(rTimer){clearInterval(rTimer);rTimer=null;$("#rPlay").textContent="▶";} else {rTimer=setInterval(()=>radarSet((rIdx+1)%radarLayers.length),600);$("#rPlay").textContent="⏸";} };
  radarSet(radarLayers.length-1);
}
function radarSet(i){
  radarLayers.forEach((l,k)=>l.setOpacity(k===i?.75:0)); rIdx=i; $("#rSlider").value=i;
  const fr=S.radar.frames[i]; $("#rTime").textContent=hm(new Date(fr.time*1000));
}

// ===== Preferiti, recenti, località =====
function renderLists(){
  $("#favList").innerHTML=S.favs.map((f,k)=>`<div class="row"><span class="nm" data-f="${k}">★ ${esc(f.name)}</span><button data-rm="${k}" aria-label="Rimuovi">×</button></div>`).join("")||`<div class="note" style="padding:0 8px">Nessun preferito</div>`;
  $("#recList").innerHTML=S.recent.map((f,k)=>`<div class="row"><span class="nm" data-r="${k}">${esc(f.name)}</span></div>`).join("");
  $("#recH").classList.toggle("hidden",!S.recent.length);
  document.querySelectorAll("[data-f]").forEach(e=>e.onclick=()=>{const f=S.favs[+e.dataset.f]; closeSheet(); setPlace(f.lat,f.lon,f.name,f.geo);});
  document.querySelectorAll("[data-r]").forEach(e=>e.onclick=()=>{const f=S.recent[+e.dataset.r]; closeSheet(); setPlace(f.lat,f.lon,f.name,f.geo);});
  document.querySelectorAll("[data-rm]").forEach(e=>e.onclick=()=>{S.favs.splice(+e.dataset.rm,1); store("mp_favs",S.favs); renderLists(); updateStar();});
}
function isFav(){ return S.lat!=null&&S.favs.some(f=>near(f,S)); }
function updateStar(){ const on=isFav(); $("#starBtn").innerHTML=`<svg viewBox="0 0 24 24" fill="${on?"#ffd36b":"none"}" stroke="${on?"#ffd36b":"currentColor"}" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>`; }
$("#starBtn").onclick=()=>{ if(S.lat==null) return; if(isFav()) S.favs=S.favs.filter(f=>!near(f,S)); else S.favs.push({name:S.name,lat:S.lat,lon:S.lon,geo:S.geo}); store("mp_favs",S.favs); updateStar(); renderLists(); };
function openSheet(){ renderLists(); $("#sheet").classList.add("open"); $("#sheetBg").classList.add("open"); setTimeout(()=>$("#q").focus(),50); }
function closeSheet(){ $("#sheet").classList.remove("open"); $("#sheetBg").classList.remove("open"); $("#q").value=""; $("#sug").innerHTML=""; }
$("#closeBtn").onclick=closeSheet; $("#placeBtn").onclick=openSheet; $("#searchBtn").onclick=openSheet; $("#sheetBg").onclick=closeSheet;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
let sugT=null;
$("#q").addEventListener("input",()=>{ clearTimeout(sugT); const v=$("#q").value.trim(); if(v.length<2){$("#sug").innerHTML="";return;}
  sugT=setTimeout(async()=>{ const j=await fetchJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=6&language=it&format=json`,0); const res=(j&&j.results)||[];
    $("#sug").innerHTML=res.map((r,k)=>`<div class="row"><span class="nm" data-s="${k}">${esc([r.name,r.admin1,r.country].filter(Boolean).join(", "))}</span></div>`).join("");
    document.querySelectorAll("[data-s]").forEach(e=>e.onclick=()=>{ const r=res[+e.dataset.s]; closeSheet(); setPlace(r.latitude,r.longitude,r.name,{cc:r.country_code,country:r.country,region:r.admin1}); });
  },280); });
$("#gpsBtn").onclick=()=>{ closeSheet(); locate(); };
function locate(fallback){
  if(!navigator.geolocation){ if(fallback) fallback(); return; }
  navigator.geolocation.getCurrentPosition(p=>setPlace(p.coords.latitude,p.coords.longitude,"La mia posizione"),()=>{ if(fallback) fallback(); else showErr("Posizione non concessa. Tocca il nome in alto per cercare una città."); },{enableHighAccuracy:true,timeout:10000});
}
function setPlace(lat,lon,name,geo){
  lat=+lat; lon=+lon;
  if(!isFinite(lat)||!isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180){ lat=44.0807; lon=12.5276; name="Viserba (Rimini)"; geo=null; }
  S.lat=lat; S.lon=lon; S.name=String(name||"").replace(/\s*\((Provincia|Province|Città metropolitana)[^)]*\)\s*$/i,"").slice(0,80); S.geo=geo&&typeof geo==="object"?{cc:String(geo.cc||""),country:String(geo.country||""),region:String(geo.region||"")}:null; name=S.name;
  $("#placeName").textContent=name;
  $("#placeSub").textContent=S.geo?[S.geo.region,S.geo.cc&&S.geo.cc.toUpperCase()!=="IT"?S.geo.country:""].filter(Boolean).join(", "):"";
  store("mp_last",{lat:S.lat,lon:S.lon,name,geo:S.geo});
  S.recent=[{name,lat:S.lat,lon:S.lon,geo:S.geo},...S.recent.filter(r=>!near(r,S))].slice(0,6); store("mp_recent",S.recent);
  updateStar(); refresh(true);
}
function showErr(m){ $("#app").innerHTML=`<div class="err">${esc(m)}</div>`; }

// ===== Aggiornamento =====
let busy=false;
async function refresh(full){
  if(busy||S.lat==null) return; busy=true; $("#refreshBtn").classList.add("spin");
  if(full&&!S.cons) $("#app").innerHTML=`<div class="loader">Carico il meteo…</div>`;
  try{
    const [D,Mr,R]=await Promise.all([loadForecast(S.lat,S.lon),loadMarine(S.lat,S.lon),radarNow(S.lat,S.lon).catch(()=>null)]);
    S.data=D; S.marine=Mr; S.radar=R; S.cons=consensus(D);
    store("mp_cache",{lat:S.lat,lon:S.lon,at:Date.now(),D,Mr});
    render(); checkRain();
  }catch(e){
    const c=load("mp_cache",null);
    if(c&&near(c,S)){ S.data=c.D; S.marine=c.Mr; S.radar=null; S.cons=consensus(c.D); render(); $("#app").insertAdjacentHTML("afterbegin",`<div class="err" style="margin-bottom:14px">Sei offline: dati del ${new Date(c.at).toLocaleString("it-IT")}</div>`); }
    else showErr("Non riesco a scaricare il meteo. Controlla la connessione e riprova.");
  }finally{ busy=false; $("#refreshBtn").classList.remove("spin"); }
}
$("#refreshBtn").onclick=()=>refresh(false);
setInterval(()=>{ if(document.visibilityState==="visible"||S.notify) refresh(false); },10*6e4);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.cons&&Date.now()-(S.lastRefresh||0)>5*6e4) refresh(false); });
window.addEventListener("resize",()=>drawTempLine());

// ===== Notifiche pioggia =====
async function toggleNotify(){
  if(S.notify){ S.notify=false; store("mp_notify",false); render(); return; }
  if(!("Notification" in window)){ alert("Questo dispositivo non supporta le notifiche."); return; }
  const p=await Notification.requestPermission(); if(p!=="granted") return;
  S.notify=true; store("mp_notify",true); render();
}
async function checkRain(){
  S.lastRefresh=Date.now();
  if(!S.notify||!S.cur||Notification.permission!=="granted") return;
  const soon=!isWet(S.cur.code)&&(S.cons.steps.slice(0,4).some(s=>s.share>=.5)||(S.radar&&S.radar.eta!=null&&S.radar.eta<=45));
  if(!soon||Date.now()-S.lastRainAlert<2*36e5) return;
  S.lastRainAlert=Date.now();
  const body=`${S.name}: ${nowcastText(S.cons,S.radar,S.cur)}`;
  try{ const reg=await navigator.serviceWorker?.getRegistration(); if(reg) reg.showNotification("Sta per piovere",{body,icon:"icon-192.png",tag:"pioggia"}); else new Notification("Sta per piovere",{body,icon:"icon-192.png"}); }catch(e){}
}

// ===== Avvio =====
S.favs=load("mp_favs",DEFAULT_FAVS.slice()); S.recent=load("mp_recent",[]); S.notify=!!load("mp_notify",false);
const last=load("mp_last",null);
if(last&&last.lat!=null) setPlace(last.lat,last.lon,last.name,last.geo);
else locate(()=>setPlace(44.0807,12.5276,"Viserba (Rimini)"));
if("serviceWorker" in navigator&&location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
